[workspace]
resolver = "2"
members = ["crates/josephine-core", "crates/josephine"]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Kevin Delfour"]
repository = "https://github.com/systm-d/josephine"
homepage = "https://github.com/systm-d/josephine"
description = "Your computer's guardian spirit"

[workspace.dependencies]
anyhow = "1"
criterion = "0.8"
assert_cmd = "2"
predicates = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "3"
comfy-table = { version = "8", features = ["tty"] }
indicatif = "0.18"
dirs = "6"
notify-rust = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.11"
sysinfo = "0.39"
ureq = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
